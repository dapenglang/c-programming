    <circle cx="148" cy="112" r="1" opacity="0.3"/>
    <circle cx="236" cy="46" r="1.5" opacity="0.5"/>
    <circle cx="318" cy="96" r="1" opacity="0.28"/>
    <circle cx="404" cy="38" r="1.2" opacity="0.38"/>
    <circle cx="492" cy="104" r="1" opacity="0.3"/>
    <circle cx="566" cy="52" r="1.4" opacity="0.44"/>
    <circle cx="648" cy="92" r="1" opacity="0.26"/>
    <circle cx="1180" cy="44" r="1.2" opacity="0.36"/>
    <circle cx="1268" cy="108" r="1" opacity="0.3"/>
    <circle cx="1352" cy="50" r="1.5" opacity="0.48"/>
    <circle cx="1524" cy="126" r="1.1" opacity="0.33"/>
    <circle cx="1568" cy="52" r="1.3" opacity="0.4"/>
    <circle cx="44" cy="316" r="1.2" opacity="0.35"/>
    <circle cx="1566" cy="298" r="1.3" opacity="0.38"/>
    <circle cx="88" cy="430" r="1.1" opacity="0.3"/>
    <circle cx="1516" cy="420" r="1.2" opacity="0.34"/>
    <circle cx="134" cy="238" r="1" opacity="0.26"/>
    <circle cx="1468" cy="222" r="1" opacity="0.26"/>
    <circle cx="298" cy="252" r="1.1" opacity="0.28"/>
    <circle cx="1302" cy="248" r="1.1" opacity="0.28"/>
    <circle cx="392" cy="438" r="1.2" opacity="0.32"/>
    <circle cx="1216" cy="446" r="1.2" opacity="0.32"/>
    <circle cx="586" cy="212" r="1" opacity="0.24"/>
    <circle cx="1012" cy="206" r="1" opacity="0.24"/>
    <circle cx="700" cy="446" r="1.1" opacity="0.3"/>
    <circle cx="916" cy="438" r="1.1" opacity="0.3"/>
