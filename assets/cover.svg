  <!-- ── 函数曲线：谷底 ── -->
  <g>
    <line x1="220" y1="562" x2="1380" y2="562" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
    <path d="M220,466 Q 800,614 1380,466" fill="none" stroke="url(#curvegrad)" stroke-width="2.6"
          stroke-linecap="round" opacity="0.92"/>
    <line x1="800" y1="544" x2="800" y2="562" stroke="#fbbf24" stroke-width="1.2"
          stroke-dasharray="3 4" opacity="0.8"/>
    <circle cx="800" cy="540" r="10" fill="#fbbf24" opacity="0.18"/>
    <circle cx="800" cy="540" r="4.4" fill="#fbbf24"/>
    <text x="812" y="534" font-family="ui-monospace, Consolas, monospace" font-size="13"
          fill="#fcd34d" opacity="0.95">global min</text>
    <text x="240" y="452" font-family="ui-monospace, Consolas, monospace" font-size="12"
          fill="#38bdf8" opacity="0.6">f(x)</text>
