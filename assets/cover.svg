      <line x1="-28" y1="-16" x2="0" y2="24"/>
      <line x1="-28" y1="16" x2="0" y2="-24"/><line x1="-28" y1="16" x2="0" y2="0"/>
      <line x1="-28" y1="16" x2="0" y2="24"/>
      <line x1="0" y1="-24" x2="28" y2="-16"/><line x1="0" y1="-24" x2="28" y2="16"/>
      <line x1="0" y1="0" x2="28" y2="-16"/><line x1="0" y1="0" x2="28" y2="16"/>
      <line x1="0" y1="24" x2="28" y2="-16"/><line x1="0" y1="24" x2="28" y2="16"/>
    </g>
    <g fill="#c4b5fd">
      <circle cx="-28" cy="-16" r="4.6"/><circle cx="-28" cy="16" r="4.6"/>
      <circle cx="0" cy="-24" r="4.6"/><circle cx="0" cy="0" r="4.6"/><circle cx="0" cy="24" r="4.6"/>
      <circle cx="28" cy="-16" r="4.6"/><circle cx="28" cy="16" r="4.6"/>
