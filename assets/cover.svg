    <circle r="58" fill="none" stroke="#2dd4bf" stroke-width="1.3" opacity="0.45"/>
    <circle cx="-26" cy="0" r="5" fill="#5eead4"/>
    <path d="M-8,-20 A 25 25 0 0 1 -8,20" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/>
