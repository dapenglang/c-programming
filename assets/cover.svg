  <g transform="translate(1462,80)">
    <rect x="-42" y="-34" width="84" height="68" rx="9" fill="#c0392b" opacity="0.07"/>
    <rect x="-42" y="-34" width="84" height="68" rx="9" fill="none" stroke="#d2523f"
          stroke-width="2.2" opacity="0.82"/>
    <text x="0" y="-2" text-anchor="middle"
          font-family="Microsoft YaHei, STKaiti, KaiTi, serif" font-size="27" font-weight="700"
          fill="#e0684f" opacity="0.92">郎</text>
    <text x="0" y="23" text-anchor="middle"
          font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#c0392b"
          letter-spacing="1.4" opacity="0.78">MARSHAL</text>
  </g>
