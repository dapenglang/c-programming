  <!-- 九颗稍亮的星：散落的暗记 -->
  <g fill="#ffffff">
    <circle cx="212" cy="176" r="2.1" opacity="0.85"/>
    <circle cx="438" cy="150" r="1.9" opacity="0.75"/>
    <circle cx="622" cy="176" r="2" opacity="0.8"/>
    <circle cx="980" cy="162" r="2" opacity="0.8"/>
    <circle cx="1164" cy="182" r="1.9" opacity="0.72"/>
    <circle cx="1386" cy="158" r="2.1" opacity="0.85"/>
    <circle cx="256" cy="270" r="1.8" opacity="0.68"/>
    <circle cx="1348" cy="266" r="1.8" opacity="0.68"/>
