  <line x1="700" y1="196" x2="900" y2="196" stroke="#38bdf8" stroke-width="1.2" opacity="0.45"/>

  <!-- ── 四个专业 ── -->
  <!-- 航建学院（2 系）· 结构 -->
  <g transform="translate(250,330)">
    <circle r="58" fill="#4da3ff" opacity="0.06"/>
    <circle r="58" fill="none" stroke="#4da3ff" stroke-width="1.3" opacity="0.45"/>
    <path d="M0,-32 L27,22 L-27,22 Z" fill="none" stroke="#4da3ff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M0,-32 L0,22 M-13,-5 L13,-5 M-13,-5 L0,22 M13,-5 L0,22" fill="none"
          stroke="#4da3ff" stroke-width="1.5" opacity="0.7"/>
    <text y="88" text-anchor="middle"
          font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#8ec5ff">航建 · 结构</text>
  </g>

