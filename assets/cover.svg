    <circle r="58" fill="none" stroke="#fbbf24" stroke-width="1.3" opacity="0.45"/>
    <ellipse rx="36" ry="14" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.85"/>
    <ellipse rx="36" ry="14" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.6" transform="rotate(60)"/>
    <ellipse rx="36" ry="14" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.6" transform="rotate(120)"/>
    <circle r="8.5" fill="#fde68a"/>
    <circle cx="0" cy="0" r="20" fill="url(#sunkernel)"/>
    <circle cx="36" cy="0" r="3.4" fill="#fde68a"/>
    <circle cx="-18" cy="31" r="3" fill="#fde68a" opacity="0.85"/>
    <text y="88" text-anchor="middle"
          font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#fcd34d">核 · 辐射</text>
